[workspace]
members = [
  "crates/pxsmith",
  "crates/pxsmith-calib",
  "crates/pxsmith-core",
  "crates/pxsmith-gen",
  "crates/pxsmith-io",
  "crates/pxsmith-lint",
  "crates/pxsmith-macro",
  "crates/pxsmith-recipe",
  "crates/pxsmith-view",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
# **既定は «出さない»**．出すクレートだけが `publish = true` を自分で名乗る．
# ライセンス欄を先に入れてあるのは，公開時に «後から決める» を残さないためである．
#
# 出せるのはライブラリだけ — **LGPL の連鎖が 0 件**である．`pxsmith-view` と
# `pxsmith` (CLI) は `viuer` 経由で `ansi_colours` (LGPL-3.0-or-later) を
# 静的リンクするので，**バイナリを配るときだけ**再リンク手段の提供義務が
# 生じる (LGPL §4)．`pxsmith-calib` は測定用ハーネスなので出さない．
publish = false
readme = "README.md"
repository = "https://github.com/akitenkrad/rs-pxsmith"
# **名前は `pxsmith*` に決めた** (2026-08-15．D175 ・D176)．
# パッケージ名 ・ディレクトリ ・ライブラリ名 ・**バイナリ名**まで揃えてある．
#
# 旧名 (`px-core` ・`px`) は crates.io で**他人が使っている** — 確認時点で
# px-core 0.3.1 (`0.1.4` / `0.1.6` / `0.1.7` もある) ・px 0.0.0．
# これは表示の問題ではない: 梱包した tarball を検証するとき path 依存は
# 登録所の依存に置き換わるので，`version = "0.1.0"` (`^0.1.0`) が
# **他人の px-core 0.1.7 に当たって**別のプロジェクトに対してコンパイルされる
# (px-io 23 件 ・px-lint 58 件のコンパイルエラーで実際に落ちた．D174) ．
# **名前を替えることが唯一の直し方である．**
#
# `pxforge` / `pixforge` / `pixelforge` も見たが，`pixforge` と `pixelforge` は
# 取られていた．`pxsmith` は本体も `pxsmith-*` の群も全部空いていた．
#
# **替えていないのは L0 の拡張子 `.px.toml` だけ** — これは道具の名前ではなく
# **形式の名前**であり，替えると既存の資産が読めなくなる．
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
blake3 = "1.5"
aseprite-io = "0.2.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
gif = "0.14"
image = "0.25.10"
palette = "0.7.7"
pxsmith-core = { path = "crates/pxsmith-core", version = "0.1.0" }
pxsmith-gen = { path = "crates/pxsmith-gen", version = "0.1.0" }
quantette = { version = "0.6", default-features = false, features = ["kmeans", "std"] }
pxsmith-io = { path = "crates/pxsmith-io", version = "0.1.0" }
pxsmith-lint = { path = "crates/pxsmith-lint", version = "0.1.0" }
pxsmith-macro = { path = "crates/pxsmith-macro", version = "0.1.0" }
pxsmith-recipe = { path = "crates/pxsmith-recipe", version = "0.1.0" }
pxsmith-view = { path = "crates/pxsmith-view", version = "0.1.0" }
rayon = "1.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
notify = "8.2"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
toml = "1.1"
# **生成 AI のバックエンドは HTTP でしか喋らない** (D156)．Rust に公式 SDK が
# 無いので生の HTTP で呼ぶ．`ureq` は同期 ・小さく ・rustls なので OpenSSL を
# 引き込まない — 道具は 1 発ずつ叩く CLI であって非同期ランタイムは要らない．
ureq = { version = "3.1", features = ["json", "rustls"] }
viuer = "0.11"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
