[workspace]
members = [
  "crates/px",
  "crates/px-calib",
  "crates/px-core",
  "crates/px-gen",
  "crates/px-io",
  "crates/px-lint",
  "crates/px-macro",
  "crates/px-recipe",
  "crates/px-view",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
# **crates.io へはまだ出さない** (付録 B #2)．安定動作を確かめてから公開する．
# ライセンス欄を先に入れてあるのは，公開時に «後から決める» を残さないためである．
#
# 出すときはライブラリ 5 クレート (px-core / px-io / px-lint / px-recipe /
# px-macro) から出せる — **LGPL の連鎖が 0 件**である．`px-view` と `px` は
# `viuer` 経由で `ansi_colours` (LGPL-3.0-or-later) を静的リンクするので，
# **バイナリを配るときだけ**再リンク手段の提供義務が生じる (LGPL §4)．
publish = false
readme = "README.md"
repository = "https://github.com/akitenkrad/rs-pxforge"
# **公開名はまだ決めていない** — `px-core` と `px` は crates.io で既に他人が
# 使っている (2026-08-15 に確認: px-core 0.3.1 ・px 0.0.0) ．`pxforge` と
# `pxforge-*` は全部空いているので，出すときは `[package] name` だけを
# `pxforge-core` などに替え，`[lib] name` を `px_core` のまま残せば
# **ソースは 1 行も変わらない**．
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
blake3 = "1.5"
aseprite-io = "0.2.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
gif = "0.14"
image = "0.25.10"
palette = "0.7.7"
px-core = { path = "crates/px-core", version = "0.1.0" }
px-gen = { path = "crates/px-gen", version = "0.1.0" }
quantette = { version = "0.6", default-features = false, features = ["kmeans", "std"] }
px-io = { path = "crates/px-io", version = "0.1.0" }
px-lint = { path = "crates/px-lint", version = "0.1.0" }
px-macro = { path = "crates/px-macro", version = "0.1.0" }
px-recipe = { path = "crates/px-recipe", version = "0.1.0" }
px-view = { path = "crates/px-view", version = "0.1.0" }
rayon = "1.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
notify = "8.2"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
toml = "1.1"
# **生成 AI のバックエンドは HTTP でしか喋らない** (D156)．Rust に公式 SDK が
# 無いので生の HTTP で呼ぶ．`ureq` は同期 ・小さく ・rustls なので OpenSSL を
# 引き込まない — 道具は 1 発ずつ叩く CLI であって非同期ランタイムは要らない．
ureq = { version = "3.1", features = ["json", "rustls"] }
viuer = "0.11"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
